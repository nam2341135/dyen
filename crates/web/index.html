<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dyen</title>
<style>
  /* ADR 0013: mọi màu là biến ở đây; bộ hiển thị chỉ sinh tên lớp. */
  :root{
    --fg:#1d2330;--muted:#5b6474;--line:#c9d0dc;--accent:#2a6fdb;--ok:#1f8a4c;--bad:#c0392b;
    --bg:#fafbfc;--surface:#fff;--selected-bg:#e8f0fd;
    --bars-c0:#4a86e8;--bars-c1:#e69138;--bars-c2:#6aa84f;--bars-c3:#a64d79;--bars-strip:#eef1f6;
    --section-cut:#2a6fdb33;--section-marked:#1f8a4c99
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  header h1{margin:0;font-size:18px}
  main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
  h2{font-size:20px;margin:16px 0 8px}
  .prompt{color:var(--muted)}
  button{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;min-height:44px;min-width:44px}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  button.secondary{background:transparent}
  button.link{border:none;background:none;color:var(--accent);padding:6px 0;text-align:left}
  .catalog{list-style:none;padding:0;margin:0}
  .catalog li{border-bottom:1px solid var(--line)}
  .catalog button.link{width:100%;padding:10px 0}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .choices{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .choice{text-align:left}
  .choice.selected{border:2px solid var(--accent);background:var(--selected-bg)}
  .choice.selected::before{content:"✓ ";font-weight:600}
  .status{color:var(--muted)}
  .error{color:var(--bad)}
  .outcome{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:8px 12px;background:var(--surface)}
  .outcome.ok{border-left-color:var(--ok)}
  .outcome ul{margin:4px 0 0;padding-left:20px}
  svg{display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  svg.bars .piece{stroke:var(--surface);stroke-width:2;cursor:pointer}
  svg.bars .piece.placed{opacity:.3}
  svg.bars .c0{fill:var(--bars-c0)}svg.bars .c1{fill:var(--bars-c1)}svg.bars .c2{fill:var(--bars-c2)}svg.bars .c3{fill:var(--bars-c3)}
  svg.bars .mark line{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 3}
  svg.bars .cut line{stroke:var(--fg);stroke-width:3}
  svg.bars .mark,svg.bars .cut{cursor:pointer}
  svg.bars .knob{stroke:var(--fg);stroke-width:2}
  svg.bars .mark .knob{fill:var(--surface)}
  svg.bars .cut .knob{fill:var(--fg)}
  svg.bars .hit{fill:transparent}
  svg.bars .strip{fill:var(--bars-strip);cursor:crosshair}
  svg.bars .ruler{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 4}
  svg.section{max-width:440px}
  svg.section .edge{stroke:var(--fg);stroke-width:2}
  svg.section .edge.hidden{stroke-dasharray:6 5;stroke:var(--muted)}
  svg.section .cut{fill:var(--section-cut);stroke:var(--accent);stroke-width:2}
  svg.section text{font-size:16px;fill:var(--fg)}
  svg.section .given{fill:var(--bad);font-weight:600}
  svg.section .site{cursor:pointer}
  svg.section .site .dot{fill:transparent;stroke:var(--muted);stroke-width:1}
  svg.section .site.marked .dot{fill:var(--section-marked);stroke:var(--ok);stroke-width:2}
  svg.section .site .hit{fill:transparent}
</style>
<body>
<noscript>Trang cần JavaScript và WebAssembly.</noscript>
<script type="module">
  import init from "./web.js";
  init();
</script>
</body>
</html>
