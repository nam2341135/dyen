[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/libs/*",
    "crates/kinds/*",
    "crates/registry",
    "crates/content",
    "crates/cli",
    "crates/web",
    "crates/room-model",
    "crates/room3d",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Nội bộ
kernel = { path = "crates/kernel" }
kind-bars = { path = "crates/kinds/bars" }
kind-choice = { path = "crates/kinds/choice" }
kind-section = { path = "crates/kinds/section" }
lib-exact = { path = "crates/libs/exact" }
registry = { path = "crates/registry" }
content = { path = "crates/content" }
room-model = { path = "crates/room-model" }
# Bên ngoài (crate thuần chỉ được dùng serde, thiserror — ADR 0006)
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "0.9"
# Chỉ cho `web` (ADR 0008); phiên bản đã đo trong spikes/leptos-bevy
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance", "Element", "DomRect", "MouseEvent", "EventTarget", "Location", "History", "HashChangeEvent", "KeyboardEvent", "Storage", "MediaQueryList", "Navigator", "Document"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Bản build wasm cho `web` (crates/web/build.sh): nhỏ gọn như spike đã đo (ADR 0008).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false # wasm-opt bỏ tên; giữ section target_features cho wasm-bindgen

# Phòng 3D (room3d, ADR 0016): opt-level 3, không "z" (spike lang-map: "z" làm khung đầu chậm 16 lần).
[profile.room-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false # như wasm-release: giữ section target_features cho wasm-bindgen

# Lặp nhanh phòng 3D: code của dự án không tối ưu, thư viện (Bevy) tối ưu để chạy được mượt.
[profile.room-dev]
inherits = "dev"

[profile.room-dev.package."*"]
opt-level = 3
