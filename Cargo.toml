[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Nội bộ
domain = { path = "crates/domain" }
manip = { path = "crates/manip" }
diagnose = { path = "crates/diagnose" }
content = { path = "crates/content" }
# Bên ngoài (crate thuần chỉ được dùng serde, thiserror — ADR 0006)
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
