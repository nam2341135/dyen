[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/libs/*",
    "crates/kinds/*",
    "crates/registry",
    "crates/content",
    "crates/cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Nội bộ
kernel = { path = "crates/kernel" }
kind-bars = { path = "crates/kinds/bars" }
kind-choice = { path = "crates/kinds/choice" }
kind-section = { path = "crates/kinds/section" }
lib-exact = { path = "crates/libs/exact" }
registry = { path = "crates/registry" }
content = { path = "crates/content" }
# Bên ngoài (crate thuần chỉ được dùng serde, thiserror — ADR 0006)
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
