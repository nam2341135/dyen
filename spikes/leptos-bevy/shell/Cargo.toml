[package]
name = "shell"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kernel.workspace = true
kind-bars.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
leptos = { version = "=0.8.23", features = ["csr"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance"] }
