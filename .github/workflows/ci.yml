# Chạy `cargo xtask ci` (fmt --check, clippy -D warnings, test, kiểm tra ranh giới)
# cho mọi lần đẩy lên main và mọi pull request.
# Phiên bản Rust lấy từ rust-toolchain.toml (rustup có sẵn trên runner tự cài).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cài toolchain theo rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci
        run: cargo xtask ci
